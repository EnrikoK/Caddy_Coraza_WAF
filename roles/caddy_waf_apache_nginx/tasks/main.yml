---
- name: Coppy Caddy static binary to host
  ansible.builtin.copy:
    src: caddy_coraza
    dest: /bin/caddy
    mode: "0755"
    owner: root
    group: root

- name: Create systemd service for Caddy
  ansible.builtin.copy:
    src: caddy.service
    dest: /etc/systemd/system/caddy.service
    mode: "0644"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Caddy dir
  ansible.builtin.file:
    path: "/etc/caddy/"
    state: directory
    mode: "0644"
    owner: root

- name: Copy vhost discovery script
  ansible.builtin.copy:
    src: discover_vhosts.sh
    dest: /usr/local/bin/discover_vhosts.sh
    mode: "0755"
    owner: root
    group: root

- name: Discover HTTP/TLS vhosts from nginx/httpd
  ansible.builtin.command: /usr/local/bin/discover_vhosts.sh
  register: caddy_tls_discovery
  changed_when: false
  when: caddy_discover_vhosts | bool

- name: Parse discovery output
  ansible.builtin.set_fact:
    caddy_discovery: "{{ caddy_tls_discovery.stdout | from_yaml }}"
  when: caddy_discover_vhosts | bool

- name: Set caddy_tls from discovery when not provided
  ansible.builtin.set_fact:
    caddy_tls: "{{ caddy_discovery.caddy_tls | default([]) }}"
  when:
    - caddy_discover_vhosts | bool
    - (caddy_tls | default([]) | length) == 0

- name: Set caddy_http from discovery when not provided
  ansible.builtin.set_fact:
    caddy_http: "{{ caddy_discovery.caddy_http | default([]) }}"
  when:
    - caddy_discover_vhosts | bool
    - (caddy_http | default([]) | length) == 0

- name: Copy base caddyfile with http configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    owner: root

- name: Redirect incoming HTTP traffic to Caddy
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "{{ caddy_regular_http_port }}"
    jump: REDIRECT
    to_ports: "{{ caddy_routed_http_port }}"
    state: present

- name: Redirect incoming HTTPS traffic to Caddy
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "{{ caddy_regular_https_port }}"
    jump: REDIRECT
    to_ports: "{{ caddy_routed_https_port }}"
    state: present

- name: Allow inbound traffic on port caddy_routed_http_port
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ caddy_routed_http_port }}"
    jump: ACCEPT
    state: present

- name: Allow inbound traffic on port caddy_routed_https_port
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ caddy_routed_https_port }}"
    jump: ACCEPT
    state: present

- name: Enable and start Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
